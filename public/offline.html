<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · HMS</title>
    <style>
      body {
        margin: 0;
        background: #faf8f4;
        color: #1b2430;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 4rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #5b6573;
        line-height: 1.5;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 1rem 0;
        border-top: 1px solid #e4e0d8;
      }
      li {
        border-bottom: 1px solid #e4e0d8;
      }
      li a {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 0;
        color: #0f766e;
        text-decoration: none;
      }
      li a:hover {
        text-decoration: underline;
      }
      li span {
        color: #5b6573;
        font-size: 0.875rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        font: inherit;
        border: 1px solid #0f766e;
        background: #0f766e;
        color: #fff;
        border-radius: 0.375rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        This page has not been saved on this computer, so it cannot open without a connection. Changes cannot be saved until you are back
        online.
      </p>
      <div id="saved" hidden>
        <p>Pages saved on this computer:</p>
        <ul id="list"></ul>
      </div>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      var LABELS = {
        "/app": "Overview",
        "/app/front-desk": "Front desk",
        "/app/front-desk/calendar": "Front desk calendar",
        "/app/front-desk/sheet": "Front desk sheet (to print)",
        "/app/rooms": "Rooms",
        "/app/rooms/calendar": "Room calendar",
        "/app/housekeeping": "Housekeeping",
        "/app/reservations": "Reservations",
      };
      var MAX_AGE = 24 * 60 * 60 * 1000;
      function label(path) {
        if (LABELS[path]) return LABELS[path];
        if (/\/documents$/.test(path)) return "Booking documents";
        if (/^\/app\/reservations\//.test(path)) return "Booking " + path.split("/")[3].slice(0, 8);
        return path;
      }
      function load() {
        if (!window.caches) return;
        caches
          .keys()
          .then(function (names) {
            var pages = names.filter(function (n) {
              return n.indexOf("hms-pages-") === 0;
            });
            if (!pages.length) return;
            return caches.open(pages[0]).then(function (cache) {
              return cache.keys().then(function (reqs) {
                return Promise.all(
                  reqs.map(function (req) {
                    return cache.match(req, { ignoreVary: true }).then(function (res) {
                      var at = res && res.headers.get("x-hms-cached-at");
                      var t = Date.parse(at || "");
                      if (!isFinite(t) || Date.now() - t > MAX_AGE) return null;
                      var u = new URL(req.url);
                      return { href: u.pathname + u.search, name: label(u.pathname), at: t };
                    });
                  }),
                );
              });
            });
          })
          .then(function (rows) {
            rows = (rows || []).filter(Boolean).sort(function (a, b) {
              return a.name.localeCompare(b.name);
            });
            if (!rows.length) return;
            var list = document.getElementById("list");
            rows.forEach(function (r) {
              var li = document.createElement("li");
              var a = document.createElement("a");
              a.href = r.href;
              var name = document.createElement("strong");
              name.textContent = r.name;
              var when = document.createElement("span");
              when.textContent = "saved " + new Date(r.at).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
              a.appendChild(name);
              a.appendChild(when);
              li.appendChild(a);
              list.appendChild(li);
            });
            document.getElementById("saved").hidden = false;
          })
          .catch(function () {});
      }
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      window.addEventListener("online", function () {
        location.reload();
      });
      load();
    </script>
  </body>
</html>
