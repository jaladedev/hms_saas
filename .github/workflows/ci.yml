name: ci
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm ci --prefix tools/lint
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    # Pinned: ubuntu-latest moved to 26.04, whose default apt sources have no
    # postgresql-16, and supabase/tests/run.sh expects /usr/lib/postgresql/16/bin.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 server
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Migrations, security tests, concurrency tests
        run: bash supabase/tests/run.sh
